openapi: 3.1.0
info:
  title: AgoraLume API
  description: 'AgoraLume API: user + multi-AI group chat with modular personas. The backend is the single source of truth for the workspace (organizations, departments, personas, groups, settings) and streams chat over SSE. This is the production API contract; the current build backs it with an in-memory store and simulated agent replies until an LLM is connected.'
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
  version: 0.1.0
paths:
  /v1beta/auth/login:
    post:
      tags:
      - auth
      summary: |-
        Logs in as the admin (username `"admin"`) or a regular account (its own
        stored username). An account with no fixed password yet accepts this
        boot's generated one instead — see the server log at startup.
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          description: Unknown username or wrong password
          content:
            text/plain:
              schema:
                type: string
  /v1beta/auth/refresh:
    post:
      tags:
      - auth
      summary: |-
        Mints a fresh access token from a still-valid refresh token, without
        asking for the password again. The refresh token itself is not rotated —
        it keeps working until its own (much longer) expiry.
      operationId: refresh
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
        '401':
          description: Unknown, expired, or not actually a refresh token
          content:
            text/plain:
              schema:
                type: string
  /v1beta/debug/usage:
    get:
      tags:
      - service
      summary: |-
        Cumulative LLM usage — the global "total usage" readout: request count,
        token breakdown, cache-hit ratio, the running estimated cost (always an
        estimate, for reference only), and the same totals broken down by model.
        When persistence is on, this survives a server restart; the cost is accrued
        one trace at a time at whatever rate was configured when each trace was
        recorded, so a later change to the configured rates never reprices history.
      operationId: debug_usage
      responses:
        '200':
          description: Cumulative LLM usage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DebugUsage'
  /v1beta/debug/usage/by-persona:
    get:
      tags:
      - service
      summary: |-
        Usage broken down by persona, site-wide — the global analogue of
        [`group_debug_usage_by_persona`], for spotting which character is
        expensive across every group rather than within one chat. Covers every AI
        persona in the workspace plus the synthetic "system" bucket (context
        compression, chat suggestions); sorted by total tokens descending. No
        group to miss, so unlike the per-group endpoints there's no 404 case.
      operationId: global_debug_usage_by_persona
      responses:
        '200':
          description: Every AI persona's usage, summed across every group
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PersonaUsage'
  /v1beta/departments:
    get:
      tags:
      - departments
      operationId: list_depts
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Department'
    post:
      tags:
      - departments
      operationId: create_dept
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Department'
        required: true
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
  /v1beta/departments/{id}:
    get:
      tags:
      - departments
      operationId: get_dept
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
        '404':
          description: ''
    delete:
      tags:
      - departments
      operationId: delete_dept
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: ''
        '404':
          description: ''
    patch:
      tags:
      - departments
      operationId: update_dept
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Department'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
        '404':
          description: ''
  /v1beta/groups:
    get:
      tags:
      - groups
      operationId: list_groups
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Group'
    post:
      tags:
      - groups
      operationId: create_group
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Group'
        required: true
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
  /v1beta/groups/{id}:
    get:
      tags:
      - groups
      operationId: get_group
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '404':
          description: ''
    delete:
      tags:
      - groups
      operationId: delete_group
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: ''
        '404':
          description: ''
    patch:
      tags:
      - groups
      operationId: update_group
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Group'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '404':
          description: ''
  /v1beta/groups/{id}/debug/traces:
    get:
      tags:
      - chat
      summary: |-
        Recent agent traces for a group — the exact prompt each character received
        and what it decided — for hydrating the debug panel. Live updates then arrive
        as `debug` SSE frames on the group stream.
      operationId: debug_traces
      parameters:
      - name: id
        in: path
        description: Group id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Recent agent traces, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AgentTrace'
  /v1beta/groups/{id}/debug/usage:
    get:
      tags:
      - chat
      summary: |-
        One group's own cumulative LLM usage — independent of every other group's,
        unlike [`debug_usage`]. The site-wide total shown in Settings is the sum of
        every group's usage (plus any spend from groups since deleted); this is one
        group's own slice of it. 404s for an unknown group, matching every other
        `/groups/{id}/...` handler — [`group_debug_usage_by_persona`] needs the
        workspace to know the group's current members, so the two must agree on
        what "unknown group" means rather than one 200-with-zeros and the other
        silently returning nothing.
      operationId: group_debug_usage
      parameters:
      - name: id
        in: path
        description: Group id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: One group's own cumulative LLM usage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DebugUsage'
        '404':
          description: Unknown group
  /v1beta/groups/{id}/debug/usage/by-persona:
    get:
      tags:
      - chat
      summary: |-
        A group's usage broken down by persona — which character is driving the
        spend, within that group's own total from [`group_debug_usage`]. Covers
        the group's current AI members; sorted by total tokens descending, like
        the per-model breakdown inside each [`DebugUsage`].
      operationId: group_debug_usage_by_persona
      parameters:
      - name: id
        in: path
        description: Group id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: That group's usage, one entry per current AI member
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PersonaUsage'
        '404':
          description: Unknown group
  /v1beta/groups/{id}/events:
    post:
      tags:
      - chat
      summary: |-
        Posts an environment event into a group — rain, time passing, an emergency —
        letting the world outside the chat influence the agents. Accepted and queued
        for the group's coordinator; its effect (reactions, moods) arrives on the
        group's SSE stream.
      operationId: post_event
      parameters:
      - name: id
        in: path
        description: Group id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventBody'
        required: true
      responses:
        '202':
          description: Event accepted
        '404':
          description: Unknown group
  /v1beta/groups/{id}/messages:
    get:
      tags:
      - chat
      summary: |-
        A contiguous window of a group's message history, oldest first. One shape drives
        every navigation: the initial open (`before` + `since`), paging earlier
        (`anchor` + `before`), paging later (`anchor` + `after`), and jumping to an
        arbitrary line (`anchor` + `before` + `after`). With no query it returns the
        whole log.
      operationId: list_messages
      parameters:
      - name: id
        in: path
        description: Group id
        required: true
        schema:
          type: string
      - name: anchor
        in: query
        description: |-
          The line to build the window around (its id). Omitted, the window ends at
          the newest line — the initial open and "jump to latest".
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: before
        in: query
        description: How many lines before the anchor (or before the tail) to include.
        required: false
        schema:
          type:
          - integer
          - 'null'
          minimum: 0
      - name: after
        in: query
        description: How many lines after the anchor to include. Ignored without an `anchor`.
        required: false
        schema:
          type:
          - integer
          - 'null'
          minimum: 0
      - name: since
        in: query
        description: |-
          The client's read mark (epoch millis), for the initial open only (no
          `anchor`): the window is extended back to cover every line newer than this,
          so the whole unread run loads and its divider stays exact.
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int64
      responses:
        '200':
          description: Message history window, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Message'
    post:
      tags:
      - chat
      summary: |-
        Posts a user message and kicks off the agents' turn. The returned line is the
        stored user message; AI replies, moods, and read receipts arrive on the
        group's SSE stream.
      operationId: send_message
      parameters:
      - name: id
        in: path
        description: Group id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendBody'
        required: true
      responses:
        '200':
          description: The stored user message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '404':
          description: Unknown group
  /v1beta/groups/{id}/retry:
    post:
      tags:
      - chat
      summary: |-
        Resumes a turn that was suspended by a failed agent inference: the agents who
        have not yet read the pending message respond to the current chat. A no-op if
        nothing is suspended (e.g. the pending turn was already voided by a newer
        message). Its effect arrives on the group's SSE stream.
      operationId: retry_turn
      parameters:
      - name: id
        in: path
        description: Group id
        required: true
        schema:
          type: string
      responses:
        '202':
          description: Retry accepted
        '404':
          description: Unknown group
  /v1beta/groups/{id}/stream:
    get:
      tags:
      - chat
      summary: |-
        Server-Sent Events for a group: default `message` events (AI replies and
        moods), named `read` events (read receipts), named `activity` events (the
        agent loop turning busy/idle), and named `turn` events (the current
        processing round's per-member progress, seeded on connect).
      operationId: stream
      parameters:
      - name: id
        in: path
        description: Group id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 'text/event-stream: `message` frames carry a Message, `read` frames carry a ReadReceipt, `activity` frames carry `{ active: bool }`, `turn` frames carry a Turn, `debug` frames carry an AgentTrace, `suggestions` frames carry a GroupSuggestions'
  /v1beta/groups/{id}/suggestions:
    get:
      tags:
      - chat
      summary: |-
        Cached conversation-starter suggestions for a group. Returned immediately from
        the server-side cache; if they're stale (the conversation moved on, or the
        part of day changed) a fresh generation is kicked off in the background and
        arrives on the group's `suggestions` SSE frame. The frontend only fetches and
        displays — it never generates. Empty (`generatedAt == 0`) before the first
        generation completes.
      operationId: get_suggestions
      parameters:
      - name: id
        in: path
        description: Group id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The cached suggestions (a background refresh may follow on the stream)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupSuggestions'
        '404':
          description: Unknown group
  /v1beta/groups/{id}/suggestions/regenerate:
    post:
      tags:
      - chat
      summary: |-
        Forces a fresh suggestion generation for a group (the composer's "give me
        other ideas" action). Accepted and generated in the background; the result
        arrives on the group's `suggestions` SSE frame. Rate-limited server-side: a
        call inside the cooldown window, or while a generation is already running, is
        quietly ignored — so the button can't be used to hammer the model.
      operationId: regenerate_suggestions
      parameters:
      - name: id
        in: path
        description: Group id
        required: true
        schema:
          type: string
      responses:
        '202':
          description: Regeneration accepted (or coalesced with a recent one)
        '404':
          description: Unknown group
  /v1beta/health:
    get:
      tags:
      - service
      summary: Liveness probe — cheap "is the server up" check.
      operationId: health
      responses:
        '200':
          description: Service is up
          content:
            text/plain:
              schema:
                type: string
  /v1beta/llm/models:
    post:
      tags:
      - llm
      summary: |-
        Lists the models a provider endpoint offers, so the Settings page can offer
        a picker instead of a blind text field. `apiKey` is optional: when omitted,
        the stored key is used, but *only* when `baseUrl` names the same endpoint
        already configured — otherwise the request must carry its own key. Without
        that check, an operator (or anything else that can reach this API) could
        point `baseUrl` at an arbitrary third-party URL and have the server hand it
        the real provider key in an outbound `Authorization` header.
      operationId: list_llm_models
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LlmModelsQuery'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LlmModelsView'
        '422':
          description: empty baseUrl, no usable key, or the endpoint rejected the request
          content:
            text/plain:
              schema:
                type: string
  /v1beta/llm/settings:
    get:
      tags:
      - llm
      summary: |-
        The live LLM provider configuration. `apiKey` is never included — only
        `hasApiKey`, whether one is currently stored.
      operationId: get_llm_settings
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LlmSettingsView'
    patch:
      tags:
      - llm
      summary: |-
        Merges a partial update onto the LLM provider configuration and applies it
        immediately — no restart needed. The candidate configuration is validated
        (the brain it describes must actually build) before anything is swapped in
        or written to `llm.toml`; an invalid patch is rejected with 422 and changes
        nothing.
      operationId: update_llm_settings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LlmSettingsPatch'
        required: true
      responses:
        '200':
          description: Applied immediately; persisted to llm.toml
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LlmSettingsView'
        '422':
          description: e.g. enabled=true without both baseUrl and model, or an endpoint that fails to construct
          content:
            text/plain:
              schema:
                type: string
  /v1beta/meta:
    get:
      tags:
      - service
      summary: |-
        The server's mode, so the client can distinguish a mock build (no LLM,
        in-memory) from a production one — separately from mere reachability.
      operationId: meta
      responses:
        '200':
          description: Server capabilities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerMeta'
  /v1beta/organizations:
    get:
      tags:
      - organizations
      operationId: list_orgs
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Organization'
    post:
      tags:
      - organizations
      operationId: create_org
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Organization'
        required: true
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
  /v1beta/organizations/{id}:
    get:
      tags:
      - organizations
      operationId: get_org
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '404':
          description: ''
    delete:
      tags:
      - organizations
      operationId: delete_org
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Deleted (cascades to its departments)
        '404':
          description: ''
    patch:
      tags:
      - organizations
      operationId: update_org
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Organization'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '404':
          description: ''
  /v1beta/personas:
    get:
      tags:
      - personas
      operationId: list_personas
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Persona'
    post:
      tags:
      - personas
      summary: |-
        Creates a persona. Rejects (409) a duplicate name (names are globally unique)
        or a second user identity (there is only ever one "you").
      operationId: create_persona
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Persona'
        required: true
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Persona'
        '409':
          description: 'Refused: name already in use, or a second user identity'
  /v1beta/personas/{id}:
    get:
      tags:
      - personas
      operationId: get_persona
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Persona'
        '404':
          description: ''
    delete:
      tags:
      - personas
      summary: |-
        Deletes a persona. Refuses (409) to remove the last remaining user identity,
        since every group still needs a "you".
      operationId: delete_persona
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: ''
        '404':
          description: ''
        '409':
          description: 'Refused: last remaining user identity'
    patch:
      tags:
      - personas
      summary: |-
        Updates a persona. 404 for an unknown id; 409 for a duplicate name or a change
        that would produce a second user identity.
      operationId: update_persona
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Persona'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Persona'
        '404':
          description: ''
        '409':
          description: 'Refused: name already in use, or a second user identity'
  /v1beta/personas/{personaId}/memories:
    get:
      tags:
      - personas
      summary: |-
        Every memory a persona has accumulated, across all of its identity versions,
        newest first. The memory-management UI groups the result by `promptHash`/label.
      operationId: list_memories
      parameters:
      - name: personaId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Memory'
        '404':
          description: ''
    post:
      tags:
      - personas
      summary: |-
        Writes a memory for a persona, tagged with its current identity hash. 404 for
        an unknown persona; 409 when the persona has no prompt to scope a memory to,
        or the content is blank.
      operationId: create_memory
      parameters:
      - name: personaId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryInput'
        required: true
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Memory'
        '404':
          description: ''
        '409':
          description: 'Refused: persona has no prompt to scope a memory to, or blank content'
  /v1beta/personas/{personaId}/memories/{memoryId}:
    delete:
      tags:
      - personas
      summary: |-
        Deletes one of a persona's memories. 404 when no such memory belongs to that
        persona.
      operationId: delete_memory
      parameters:
      - name: personaId
        in: path
        required: true
        schema:
          type: string
      - name: memoryId
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: ''
        '404':
          description: ''
  /v1beta/prompt-labels:
    get:
      tags:
      - personas
      summary: |-
        All user-assigned names for persona identity hashes. The memory UI reads this
        to show a friendly label (e.g. "bar 版") next to a persona's prompt version.
      operationId: list_prompt_labels
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PromptLabel'
  /v1beta/prompt-labels/{hash}:
    put:
      tags:
      - personas
      summary: |-
        Names an identity hash, or clears its name when the label is blank. Idempotent
        (PUT), keyed by the full hash the client already holds from the persona.
      operationId: set_prompt_label
      parameters:
      - name: hash
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromptLabelInput'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromptLabel'
  /v1beta/settings:
    get:
      tags:
      - settings
      operationId: get_settings
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
    patch:
      tags:
      - settings
      operationId: update_settings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Settings'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '422':
          description: ''
components:
  schemas:
    AccessToken:
      type: object
      required:
      - accessToken
      properties:
        accessToken:
          type: string
    AgentTrace:
      type: object
      description: |-
        A debug record of one agent inference: exactly the system + context the
        character's model received, what it decided, and the tokens it cost. Streamed
        live as a `debug` SSE frame and available in bulk for panel hydration.
      required:
      - ts
      - groupId
      - personaId
      - personaName
      - system
      - conversation
      - action
      properties:
        action:
          type: string
          description: 'The chosen action: `speak` | `speakWithMood` | `mood` | `read`.'
        conversation:
          type: string
          description: The conversation/context text the agent read (the "public" messages).
        durationMs:
          type:
          - integer
          - 'null'
          format: int64
          description: Wall-clock time the brain call took, in milliseconds.
        estimatedCost:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/Cost'
            description: |-
              This one call's own estimated cost, priced at the rate configured when
              it was recorded. Filled in by [`crate::state::AppState::record_trace`]
              (the caller never sets it), so it starts `None` at construction and is
              absent whenever pricing isn't configured. Always an estimate — see
              [`Cost`].
        groupId:
          type: string
        message:
          type:
          - string
          - 'null'
          description: The spoken line, when it spoke.
        model:
          type:
          - string
          - 'null'
          description: |-
            The model that produced this inference (e.g. `gpt-4o-mini`); absent for
            the mock brain, which runs no model.
        mood:
          type:
          - string
          - 'null'
          description: The mood, when it showed one.
        personaId:
          type: string
        personaName:
          type: string
        system:
          type: string
          description: The full system prompt the agent got (persona + variables + roster).
        ts:
          type: integer
          format: int64
        usage:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/TokenUsage'
            description: Tokens this inference cost; absent for the mock brain.
    Cost:
      type: object
      description: |-
        An estimated cost breakdown for the accumulated usage. Always an estimate:
        rates are operator-supplied and providers/models differ, so the UI labels it
        "for reference only".
      required:
      - currency
      - input
      - cachedInput
      - output
      - total
      properties:
        cachedInput:
          type: number
          format: double
          description: Cost of cached input tokens.
        currency:
          type: string
          description: Currency label the rates are in (e.g. `USD`).
        input:
          type: number
          format: double
          description: Cost of fresh (non-cached) input tokens.
        output:
          type: number
          format: double
          description: Cost of output tokens.
        total:
          type: number
          format: double
          description: Sum of the above.
    DebugUsage:
      type: object
      description: |-
        Cumulative LLM usage across the whole server (since first run, when
        persisted; since startup otherwise) — the global "total usage" view.
        `GET /debug/usage`.
      required:
      - requests
      - promptTokens
      - completionTokens
      - totalTokens
      - cachedPromptTokens
      - cacheHitRatio
      properties:
        cacheHitRatio:
          type: number
          format: double
          description: |-
            Cached prompt tokens ÷ prompt tokens, in `0.0..=1.0`; `0` before any
            usage is seen. How much the cache is saving.
        cachedPromptTokens:
          type: integer
          format: int64
          minimum: 0
        completionTokens:
          type: integer
          format: int64
          minimum: 0
        estimatedCost:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/Cost'
            description: |-
              The running total, accrued one trace at a time at whatever rate was
              configured when each trace was recorded. Present once at least one
              costed trace has been recorded; absent when pricing has never been
              configured. Always an estimate — see [`Cost`].
        models:
          type: array
          items:
            $ref: '#/components/schemas/ModelUsage'
          description: |-
            The same totals broken down by model, largest (by total tokens) first.
            Empty until the first inference is recorded.
        promptTokens:
          type: integer
          format: int64
          minimum: 0
        requests:
          type: integer
          format: int64
          description: Number of agent inferences (LLM requests in LLM mode).
          minimum: 0
        totalTokens:
          type: integer
          format: int64
          minimum: 0
    Department:
      type: object
      description: |-
        A sub-unit inside an organization; its variables sit between the org's and
        the persona's in the inheritance chain.
      required:
      - organizationId
      - name
      properties:
        blurb:
          type:
          - string
          - 'null'
        color:
          type:
          - string
          - 'null'
        id:
          type: string
        name:
          type: string
        organizationId:
          type: string
        variables:
          type:
          - object
          - 'null'
          additionalProperties:
            type: string
          propertyNames:
            type: string
    EventBody:
      type: object
      description: The body of an environment-event request.
      required:
      - description
      properties:
        description:
          type: string
          description: A short description of what changed, e.g. "It starts to rain."
        urgent:
          type: boolean
          description: |-
            Urgent events preempt the current turn (discarding the in-flight agent);
            ordinary ones fold into the context at the next agent boundary.
    Group:
      type: object
      description: |-
        A chat room: the AI personas that may speak, plus the user identity that
        represents "you" here.
      required:
      - name
      - personaIds
      - selfPersonaId
      properties:
        id:
          type: string
        name:
          type: string
        personaIds:
          type: array
          items:
            type: string
        selfPersonaId:
          type: string
    GroupSuggestions:
      type: object
      description: |-
        Conversation-starter suggestions for a group: a few short first-person
        messages the user could send next when they aren't sure what to say. Generated
        server-side and cached (and persisted) so they aren't recomputed on every
        open — the frontend only fetches and displays them. Time-aware via
        [`GroupSuggestions::time_of_day`] so an evening opener isn't offered in the
        morning. `GET /groups/{id}/suggestions`.
      required:
      - prompts
      - generatedAt
      properties:
        generatedAt:
          type: integer
          format: int64
          description: When these were generated (epoch ms); `0` before the first generation.
        prompts:
          type: array
          items:
            type: string
          description: |-
            The suggested opener lines, in the user's language. Empty until the first
            generation for this group completes.
        throughId:
          type:
          - string
          - 'null'
          description: |-
            Id of the last conversation message present when these were generated — the
            conversation-staleness key. Server bookkeeping the UI can ignore; absent
            when the group had no messages yet.
        timeOfDay:
          type: string
          description: |-
            The coarse time-of-day bucket the suggestions were tuned for
            (`morning` / `afternoon` / `evening` / `night`) — lets the server tell when
            they've gone stale against the clock, and the UI hint the framing.
    LlmModelInfo:
      type: object
      description: |-
        One model a provider's listing endpoint reported. `name` is a display label
        when the provider offers one (Gemini does; OpenAI-compatible listings
        usually don't), never required for choosing the model — `id` is what's
        actually sent as `LlmSettings::model`.
      required:
      - id
      properties:
        id:
          type: string
        name:
          type:
          - string
          - 'null'
    LlmModelsQuery:
      type: object
      description: |-
        The `POST /llm/models` request: which endpoint to list models from. `apiKey`
        is optional — omitted, the backend uses the currently-stored key, but only
        when `baseUrl` matches the stored endpoint (see `routes::llm`), so this
        can't be used to make the server send its stored credential to an arbitrary
        third-party URL.
      required:
      - baseUrl
      properties:
        apiKey:
          type:
          - string
          - 'null'
        baseUrl:
          type: string
    LlmModelsView:
      type: object
      description: The `POST /llm/models` response.
      required:
      - models
      properties:
        models:
          type: array
          items:
            $ref: '#/components/schemas/LlmModelInfo'
    LlmSettingsPatch:
      type: object
      description: |-
        A partial update to the LLM provider configuration — every field is
        optional; an absent field leaves the current value alone. `baseUrl` /
        `model` / `apiKey` treat an empty string as "clear this field", matching the
        endpoint's other optional-string convention (there's never a reason to
        *store* an empty string here). `pricing` with both rates at zero clears the
        configured pricing (shows token counts only) rather than pinning a $0 rate.
      properties:
        apiKey:
          type:
          - string
          - 'null'
          description: |-
            The new key, or `""` to clear it. Omit entirely to leave the stored key
            untouched — the frontend must never send this unless the operator
            actually typed a new value, or every unrelated settings save would wipe
            the key.
        baseUrl:
          type:
          - string
          - 'null'
        compressAfter:
          type:
          - integer
          - 'null'
          minimum: 0
        compressKeep:
          type:
          - integer
          - 'null'
          minimum: 0
        compressMaxTokens:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
        enabled:
          type:
          - boolean
          - 'null'
        maxRetries:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
        maxRpm:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
        maxTokens:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
        model:
          type:
          - string
          - 'null'
        pricing:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/Pricing'
        retryBaseMs:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
    LlmSettingsView:
      type: object
      description: |-
        The `GET`/`PATCH /llm/settings` response: the live LLM provider
        configuration, with the API key stripped to a presence flag. Built by hand
        from [`crate::llm_config::LlmSettings`] (never derived by serializing it
        directly) — that's the one place a leaked key would slip out.
      required:
      - enabled
      - hasApiKey
      - maxTokens
      - maxRpm
      - maxRetries
      - retryBaseMs
      - compressAfter
      - compressKeep
      - compressMaxTokens
      properties:
        baseUrl:
          type:
          - string
          - 'null'
        compressAfter:
          type: integer
          minimum: 0
        compressKeep:
          type: integer
          minimum: 0
        compressMaxTokens:
          type: integer
          format: int64
          minimum: 0
        enabled:
          type: boolean
        hasApiKey:
          type: boolean
          description: |-
            Whether a key is currently stored. The key itself is never sent to a
            client once saved.
        maxRetries:
          type: integer
          format: int32
          minimum: 0
        maxRpm:
          type: integer
          format: int64
          minimum: 0
        maxTokens:
          type: integer
          format: int64
          minimum: 0
        model:
          type:
          - string
          - 'null'
        pricing:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/Pricing'
        retryBaseMs:
          type: integer
          format: int64
          minimum: 0
    LoginRequest:
      type: object
      required:
      - username
      - password
      properties:
        password:
          type: string
        username:
          type: string
          description: The fixed admin login name, or a regular account's own username.
    Memory:
      type: object
      description: |-
        One persona-scoped memory: a fact a character chose to remember. Tagged with
        the persona identity hash ([`Persona::prompt_hash`]) that was in force when it
        was written, so a later rewrite of the persona never recalls a previous
        version's memories out of character. Persisted in the workspace snapshot
        alongside the personas the memories belong to.
      required:
      - id
      - personaId
      - promptHash
      - content
      - createdAt
      properties:
        content:
          type: string
        createdAt:
          type: integer
          format: int64
          description: Milliseconds since the Unix epoch when the memory was written.
        id:
          type: string
        personaId:
          type: string
        promptHash:
          type: string
          description: |-
            The persona identity hash in force when this memory was written — the
            scope key that keeps recall in-character. Always a real hash: a persona
            with no prompt (no hash) can hold no memories.
    MemoryInput:
      type: object
      description: 'Request body for writing a memory: just the text to remember.'
      required:
      - content
      properties:
        content:
          type: string
    Message:
      oneOf:
      - type: object
        description: A normal, readable message.
        required:
        - id
        - groupId
        - personaId
        - ts
        - text
        - kind
        properties:
          groupId:
            type: string
          id:
            type: string
          kind:
            type: string
            enum:
            - conversation
          personaId:
            type: string
          readBy:
            type:
            - array
            - 'null'
            items:
              type: string
            description: AI persona ids that have successfully processed (read) this message.
          streaming:
            type:
            - boolean
            - 'null'
          text:
            type: string
          ts:
            type: integer
            format: int64
      - type: object
        description: A persona broadcasting its current mood/emotion.
        required:
        - id
        - groupId
        - personaId
        - ts
        - mood
        - kind
        properties:
          groupId:
            type: string
          id:
            type: string
          kind:
            type: string
            enum:
            - mood
          mood:
            type: string
          note:
            type:
            - string
            - 'null'
          personaId:
            type: string
          ts:
            type: integer
            format: int64
      - type: object
        description: |-
          A system notice that an agent's inference failed after exhausting retries.
          Surfaces the HTTP status and canonical reason only — never the provider's
          raw body, which can leak quota or key details. `personaId` is the agent
          that failed. The frontend renders it as an error line with a retry button.
        required:
        - id
        - groupId
        - personaId
        - ts
        - reason
        - kind
        properties:
          groupId:
            type: string
          id:
            type: string
          kind:
            type: string
            enum:
            - system
          personaId:
            type: string
          reason:
            type: string
            description: |-
              The status's canonical reason (e.g. "Too Many Requests"), or a short
              generic label for a transport failure with no status.
          status:
            type:
            - integer
            - 'null'
            format: int32
            description: The HTTP status code, when the failure carried one (e.g. 429).
            minimum: 0
          ts:
            type: integer
            format: int64
      description: One chat line. Tagged by `kind`, matching the TypeScript `Message` union.
    ModelUsage:
      type: object
      description: |-
        One model's slice of the cumulative usage — e.g. after switching providers
        or models mid-run, each keeps its own running total rather than blending
        into a single undifferentiated number. Part of [`DebugUsage::models`].
      required:
      - model
      - requests
      - promptTokens
      - completionTokens
      - totalTokens
      - cachedPromptTokens
      properties:
        cachedPromptTokens:
          type: integer
          format: int64
          minimum: 0
        completionTokens:
          type: integer
          format: int64
          minimum: 0
        estimatedCost:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/Cost'
            description: |-
              Present once at least one costed trace has been recorded for this
              model; absent when pricing was never configured while it was in use.
        model:
          type: string
          description: |-
            The model name (e.g. `gpt-4o-mini`), or `"unknown"` for traces from a
            brain that runs no real model (the rule-based mock).
        promptTokens:
          type: integer
          format: int64
          minimum: 0
        requests:
          type: integer
          format: int64
          minimum: 0
        totalTokens:
          type: integer
          format: int64
          minimum: 0
    Organization:
      type: object
      description: |-
        A bucket for classifying personas that also carries shared template
        variables its members inherit.
      required:
      - name
      properties:
        blurb:
          type:
          - string
          - 'null'
        color:
          type:
          - string
          - 'null'
        id:
          type: string
        name:
          type: string
        variables:
          type:
          - object
          - 'null'
          additionalProperties:
            type: string
          propertyNames:
            type: string
    Persona:
      type: object
      description: |-
        A user identity or an AI agent. AI personas carry the system prompt and
        variables the model needs; user personas are just a "you" to speak as.
      required:
      - name
      - kind
      - color
      properties:
        avatarUrl:
          type:
          - string
          - 'null'
        blurb:
          type:
          - string
          - 'null'
        color:
          type: string
        departmentId:
          type:
          - string
          - 'null'
        emoji:
          type:
          - string
          - 'null'
        gradient:
          type:
          - string
          - 'null'
        id:
          type: string
        kind:
          $ref: '#/components/schemas/PersonaKind'
        name:
          type: string
        organizationId:
          type:
          - string
          - 'null'
        promptHash:
          type:
          - string
          - 'null'
          description: |-
            Content hash of the raw `system_prompt` template — the persona's identity
            "version". Server-computed and effectively read-only on the wire: it is
            recomputed on every create/update (and on load) and any value a client
            sends is ignored. `None` when there is no prompt (user identities). Full
            lowercase-hex SHA-256; the UI shows a truncated prefix. See [`prompt_hash`].
        systemPrompt:
          type:
          - string
          - 'null'
        variables:
          type:
          - object
          - 'null'
          additionalProperties:
            type: string
          propertyNames:
            type: string
    PersonaKind:
      type: string
      description: 'The two persona roles: a user''s own identity vs. an AI agent.'
      enum:
      - user
      - ai
    PersonaUsage:
      type: object
      description: |-
        One persona's own slice of a usage total — a further breakdown by which
        character is driving the spend. Serves both `GET
        /groups/{id}/debug/usage/by-persona` (one group's [`DebugUsage`]) and the
        site-wide `GET /debug/usage/by-persona` (summed across every group).
      required:
      - personaId
      - usage
      properties:
        personaId:
          type: string
        usage:
          $ref: '#/components/schemas/DebugUsage'
    Pricing:
      type: object
      description: |-
        Token pricing used to turn usage into an estimated cost. Rates are per
        1,000,000 tokens, in `currency`. A rough operator-supplied estimate — models
        and providers differ — so the UI always labels the result "for reference".
        Doubles as a wire type (`GET`/`PATCH /llm/settings`), hence `camelCase`; the
        one place that reads a little unusual is its own corner of `llm.toml`.
      required:
      - inputPerM
      - cachedInputPerM
      - outputPerM
      - currency
      properties:
        cachedInputPerM:
          type: number
          format: double
          description: |-
            Price per 1M cached input tokens. Usually cheaper than fresh input;
            defaults to the fresh input rate when not set (a conservative estimate
            that shows no cache saving until a discounted rate is provided).
        currency:
          type: string
          description: Currency label the rates are quoted in.
        inputPerM:
          type: number
          format: double
          description: Price per 1M fresh (non-cached) input tokens.
        outputPerM:
          type: number
          format: double
          description: Price per 1M output tokens.
    PromptLabel:
      type: object
      description: |-
        A user-assigned, git-tag-style name for a persona identity hash
        ([`Persona::prompt_hash`]). Held in a side table so naming a version never
        mutates the persona itself; content-addressing means reverting to earlier
        exact prompt text resolves back to the same (possibly already-named) hash.
      required:
      - hash
      - label
      properties:
        hash:
          type: string
        label:
          type: string
    PromptLabelInput:
      type: object
      description: Request body for naming a prompt identity hash. A blank label clears the name.
      required:
      - label
      properties:
        label:
          type: string
    ReadReceipt:
      type: object
      description: |-
        A single AI persona acknowledging it successfully processed a message —
        whether or not it chose to reply (agents may read without replying).
      required:
      - groupId
      - messageId
      - personaId
      properties:
        groupId:
          type: string
        messageId:
          type: string
        personaId:
          type: string
    RefreshRequest:
      type: object
      required:
      - refreshToken
      properties:
        refreshToken:
          type: string
    SendBody:
      type: object
      description: The body of a send request.
      required:
      - text
      properties:
        personaId:
          type:
          - string
          - 'null'
          description: |-
            The "you" identity to author the message as. When omitted, the group's
            stored `selfPersonaId` is used.
        text:
          type: string
          description: The message text.
    ServerMeta:
      type: object
      description: |-
        What the running server offers — lets the client tell a mock build (no LLM,
        in-memory only) apart from a production one, independently of whether the
        server is reachable at all.
      required:
      - mock
      - llm
      - persistent
      - authRequired
      - version
      properties:
        authRequired:
          type: boolean
          description: |-
            Whether a client must log in (`POST /auth/login`) before anything
            else works — false under mock mode or `AGORALUME_AUTH_DISABLED`, in
            which case every request resolves to the bootstrap account with no
            token at all. Independent of `mock`/`llm`: a persistent server with
            no real model wired in still enforces login.
        llm:
          type: boolean
          description: An LLM is wired in to generate replies.
        mock:
          type: boolean
          description: |-
            No LLM and no persistence — the "mock" mode. Equivalent to
            `!llm && !persistent`.
        persistent:
          type: boolean
          description: State is persisted and survives a restart.
        version:
          type: string
          description: Server crate version.
    Settings:
      type: object
      description: User-level preferences.
      required:
      - uiLanguage
      - nativeLanguage
      - chatFontSize
      properties:
        chatFontSize:
          type: integer
          format: int32
        nativeLanguage:
          type: string
        uiLanguage:
          type: string
    TokenPair:
      type: object
      required:
      - accessToken
      - refreshToken
      properties:
        accessToken:
          type: string
          description: 'Short-lived; sent as `Authorization: Bearer <token>` on every request.'
        refreshToken:
          type: string
          description: |-
            Long-lived; used only against `POST /auth/refresh` to mint a fresh
            access token without asking for the password again.
    TokenUsage:
      type: object
      description: |-
        Token usage for one LLM inference. Zero across the board when the provider
        reports nothing; entirely absent (on the trace) for the rule-based mock,
        which makes no LLM call.
      required:
      - promptTokens
      - completionTokens
      - totalTokens
      - cachedPromptTokens
      properties:
        cachedPromptTokens:
          type: integer
          format: int64
          description: |-
            Of the prompt tokens, how many were served from the provider's cache —
            billed cheaper. The basis for the cache-hit ratio and cache savings.
          minimum: 0
        completionTokens:
          type: integer
          format: int64
          description: Output ("completion") tokens billed for this call.
          minimum: 0
        promptTokens:
          type: integer
          format: int64
          description: Input ("prompt") tokens billed for this call.
          minimum: 0
        totalTokens:
          type: integer
          format: int64
          description: |-
            Total tokens the provider reported (or input+output when it only gives
            the two).
          minimum: 0
    Turn:
      type: object
      description: |-
        A processing round: what triggered it and how far each AI member has got.
        Owned by the backend and streamed independently of message history (a named
        `turn` SSE frame, seeded on connect), so the pinned progress bar reflects the
        *current* processing state whether or not the trigger line is in the loaded
        window — and shows progress for event triggers that have no user message at
        all. `active` tracks whether the coordinator is still running the round.
      required:
      - id
      - groupId
      - trigger
      - startedAt
      - active
      - members
      properties:
        active:
          type: boolean
          description: Whether the coordinator is still running this turn.
        groupId:
          type: string
        id:
          type: string
        members:
          type: array
          items:
            $ref: '#/components/schemas/TurnMember'
          description: |-
            The AI members participating, in the group's member order, each with its
            progress this round.
        startedAt:
          type: integer
          format: int64
          description: Epoch millis when the turn started.
        trigger:
          $ref: '#/components/schemas/TurnTrigger'
    TurnMember:
      type: object
      description: One AI member's progress within a turn.
      required:
      - personaId
      - state
      properties:
        personaId:
          type: string
        replyId:
          type:
          - string
          - 'null'
          description: |-
            The id of this member's first reply line this turn — the avatar's jump
            target. Present only once `state` is `replied`.
        state:
          $ref: '#/components/schemas/TurnMemberState'
    TurnMemberState:
      type: string
      description: |-
        How far one AI member has got in the current turn — the buckets the pinned
        progress bar tints avatars by. Mirrors a read receipt's meaning but is
        turn-scoped rather than message-scoped, so it works for an event trigger that
        has no message to hang a receipt on.
      enum:
      - pending
      - read
      - replied
    TurnTrigger:
      oneOf:
      - type: object
        description: |-
          A user (or persona) message. `messageId` locates it in the log; `text` and
          `personaId` are carried so the bar can render the trigger even when that
          line is outside the client's loaded history window.
        required:
        - messageId
        - personaId
        - text
        - kind
        properties:
          kind:
            type: string
            enum:
            - message
          messageId:
            type: string
          personaId:
            type: string
          text:
            type: string
      - type: object
        description: |-
          An environment event — rain, time passing, an emergency. `label` is the
          description shown; there is no message to jump to.
        required:
        - label
        - kind
        properties:
          kind:
            type: string
            enum:
            - event
          label:
            type: string
      description: |-
        What kicked off a turn: a conversation line someone sent, or an environment
        event that carries no message of its own. Tagged by `kind` to match the
        TypeScript union.
