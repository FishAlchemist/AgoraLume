  description: Top-level persona buckets
- name: departments
  description: Sub-units within an organization
- name: personas
  description: User identities and AI agents
- name: groups
  description: Chat rooms and their membership
- name: preferences
  description: The signed-in account's own display preferences
- name: diagnostics
  description: Token usage, estimated cost, and agent traces
- name: llm
  description: 'Operator: real-model provider configuration'
- name: auth
  description: Login and token refresh, shared by every role
- name: accounts
  description: 'Admin: provisioning and listing accounts'
