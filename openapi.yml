openapi: 3.1.0
info:
  title: AgoraLume API
  description: 'AgoraLume API: user + multi-AI group chat with modular personas. The backend is the single source of truth for the workspace (organizations, departments, personas, groups, settings) and streams chat over SSE. This is the production API contract; the current build backs it with an in-memory store and simulated agent replies until an LLM is connected.'
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
  version: 0.1.0
paths:
  /departments:
    get:
      tags:
      - departments
      operationId: list_depts
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Department'
    post:
      tags:
      - departments
      operationId: create_dept
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Department'
        required: true
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
  /departments/{id}:
    get:
      tags:
      - departments
      operationId: get_dept
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
        '404':
          description: ''
    delete:
      tags:
      - departments
      operationId: delete_dept
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: ''
        '404':
          description: ''
    patch:
      tags:
      - departments
      operationId: update_dept
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Department'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
        '404':
          description: ''
  /groups:
    get:
      tags:
      - groups
      operationId: list_groups
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Group'
    post:
      tags:
      - groups
      operationId: create_group
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Group'
        required: true
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
  /groups/{id}:
    get:
      tags:
      - groups
      operationId: get_group
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '404':
          description: ''
    delete:
      tags:
      - groups
      operationId: delete_group
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: ''
        '404':
          description: ''
    patch:
      tags:
      - groups
      operationId: update_group
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Group'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '404':
          description: ''
  /groups/{id}/messages:
    get:
      tags:
      - chat
      summary: The full message history for a group, oldest first.
      operationId: list_messages
      parameters:
      - name: id
        in: path
        description: Group id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Message history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Message'
    post:
      tags:
      - chat
      summary: |-
        Posts a user message and kicks off the agents' turn. The returned line is the
        stored user message; AI replies, moods, and read receipts arrive on the
        group's SSE stream.
      operationId: send_message
      parameters:
      - name: id
        in: path
        description: Group id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendBody'
        required: true
      responses:
        '200':
          description: The stored user message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '404':
          description: Unknown group
  /groups/{id}/stream:
    get:
      tags:
      - chat
      summary: |-
        Server-Sent Events for a group: default `message` events (AI replies and
        moods) and named `read` events (read receipts).
      operationId: stream
      parameters:
      - name: id
        in: path
        description: Group id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 'text/event-stream: `message` frames carry a Message, `read` frames carry a ReadReceipt'
  /health:
    get:
      tags:
      - service
      summary: Liveness probe — cheap "is the server up" check.
      operationId: health
      responses:
        '200':
          description: Service is up
          content:
            text/plain:
              schema:
                type: string
  /meta:
    get:
      tags:
      - service
      summary: |-
        The server's mode, so the client can distinguish a mock build (no LLM,
        in-memory) from a production one — separately from mere reachability.
      operationId: meta
      responses:
        '200':
          description: Server capabilities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerMeta'
  /organizations:
    get:
      tags:
      - organizations
      operationId: list_orgs
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Organization'
    post:
      tags:
      - organizations
      operationId: create_org
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Organization'
        required: true
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
  /organizations/{id}:
    get:
      tags:
      - organizations
      operationId: get_org
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '404':
          description: ''
    delete:
      tags:
      - organizations
      operationId: delete_org
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Deleted (cascades to its departments)
        '404':
          description: ''
    patch:
      tags:
      - organizations
      operationId: update_org
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Organization'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '404':
          description: ''
  /personas:
    get:
      tags:
      - personas
      operationId: list_personas
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Persona'
    post:
      tags:
      - personas
      operationId: create_persona
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Persona'
        required: true
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Persona'
  /personas/{id}:
    get:
      tags:
      - personas
      operationId: get_persona
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Persona'
        '404':
          description: ''
    delete:
      tags:
      - personas
      summary: |-
        Deletes a persona. Refuses (409) to remove the last remaining user identity,
        since every group still needs a "you".
      operationId: delete_persona
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: ''
        '404':
          description: ''
        '409':
          description: 'Refused: last remaining user identity'
    patch:
      tags:
      - personas
      operationId: update_persona
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Persona'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Persona'
        '404':
          description: ''
  /settings:
    get:
      tags:
      - settings
      operationId: get_settings
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
    patch:
      tags:
      - settings
      operationId: update_settings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Settings'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '422':
          description: ''
components:
  schemas:
    Department:
      type: object
      description: |-
        A sub-unit inside an organization; its variables sit between the org's and
        the persona's in the inheritance chain.
      required:
      - organizationId
      - name
      properties:
        blurb:
          type:
          - string
          - 'null'
        color:
          type:
          - string
          - 'null'
        id:
          type: string
        name:
          type: string
        organizationId:
          type: string
        variables:
          type:
          - object
          - 'null'
          additionalProperties:
            type: string
          propertyNames:
            type: string
    Group:
      type: object
      description: |-
        A chat room: the AI personas that may speak, plus the user identity that
        represents "you" here.
      required:
      - name
      - personaIds
      - selfPersonaId
      properties:
        id:
          type: string
        name:
          type: string
        personaIds:
          type: array
          items:
            type: string
        selfPersonaId:
          type: string
    Message:
      oneOf:
      - type: object
        description: A normal, readable message.
        required:
        - id
        - groupId
        - personaId
        - ts
        - text
        - kind
        properties:
          groupId:
            type: string
          id:
            type: string
          kind:
            type: string
            enum:
            - conversation
          personaId:
            type: string
          readBy:
            type:
            - array
            - 'null'
            items:
              type: string
            description: AI persona ids that have successfully processed (read) this message.
          streaming:
            type:
            - boolean
            - 'null'
          text:
            type: string
          ts:
            type: integer
            format: int64
      - type: object
        description: A persona broadcasting its current mood/emotion.
        required:
        - id
        - groupId
        - personaId
        - ts
        - mood
        - kind
        properties:
          groupId:
            type: string
          id:
            type: string
          kind:
            type: string
            enum:
            - mood
          mood:
            type: string
          note:
            type:
            - string
            - 'null'
          personaId:
            type: string
          ts:
            type: integer
            format: int64
      description: One chat line. Tagged by `kind`, matching the TypeScript `Message` union.
    Organization:
      type: object
      description: |-
        A bucket for classifying personas that also carries shared template
        variables its members inherit.
      required:
      - name
      properties:
        blurb:
          type:
          - string
          - 'null'
        color:
          type:
          - string
          - 'null'
        id:
          type: string
        name:
          type: string
        variables:
          type:
          - object
          - 'null'
          additionalProperties:
            type: string
          propertyNames:
            type: string
    Persona:
      type: object
      description: |-
        A user identity or an AI agent. AI personas carry the system prompt and
        variables the model needs; user personas are just a "you" to speak as.
      required:
      - name
      - kind
      - color
      properties:
        avatarUrl:
          type:
          - string
          - 'null'
        blurb:
          type:
          - string
          - 'null'
        color:
          type: string
        departmentId:
          type:
          - string
          - 'null'
        emoji:
          type:
          - string
          - 'null'
        gradient:
          type:
          - string
          - 'null'
        id:
          type: string
        kind:
          $ref: '#/components/schemas/PersonaKind'
        name:
          type: string
        organizationId:
          type:
          - string
          - 'null'
        systemPrompt:
          type:
          - string
          - 'null'
        variables:
          type:
          - object
          - 'null'
          additionalProperties:
            type: string
          propertyNames:
            type: string
    PersonaKind:
      type: string
      description: 'The two persona roles: a user''s own identity vs. an AI agent.'
      enum:
      - user
      - ai
    ReadReceipt:
      type: object
      description: |-
        A single AI persona acknowledging it successfully processed a message —
        whether or not it chose to reply (agents may read without replying).
      required:
      - groupId
      - messageId
      - personaId
      properties:
        groupId:
          type: string
        messageId:
          type: string
        personaId:
          type: string
    SendBody:
      type: object
      description: The body of a send request.
      required:
      - text
      properties:
        personaId:
          type:
          - string
          - 'null'
          description: |-
            The "you" identity to author the message as. When omitted, the group's
            stored `selfPersonaId` is used.
        text:
          type: string
          description: The message text.
    ServerMeta:
      type: object
      description: |-
        What the running server offers — lets the client tell a mock build (no LLM,
        in-memory only) apart from a production one, independently of whether the
        server is reachable at all.
      required:
      - mock
      - llm
      - persistent
      - version
      properties:
        llm:
          type: boolean
          description: An LLM is wired in to generate replies.
        mock:
          type: boolean
          description: |-
            No LLM and no persistence — the "mock" mode. Equivalent to
            `!llm && !persistent`.
        persistent:
          type: boolean
          description: State is persisted and survives a restart.
        version:
          type: string
          description: Server crate version.
    Settings:
      type: object
      description: User-level preferences.
      required:
      - uiLanguage
      - nativeLanguage
      - chatFontSize
      properties:
        chatFontSize:
          type: integer
          format: int32
        nativeLanguage:
          type: string
        uiLanguage:
          type: string
tags:
- name: service
  description: Liveness and server mode
- name: chat
  description: Messages and the live SSE stream
- name: organizations
  description: Top-level persona buckets
- name: departments
  description: Sub-units within an organization
- name: personas
  description: User identities and AI agents
- name: groups
  description: Chat rooms and their membership
- name: settings
  description: Client preferences
