openapi: 3.1.0
info:
  title: AgoraLume API
  description: |-
    User + multi-AI group chat with modular personas. The backend owns the workspace and streams chat over SSE.

    POST creates (201), PATCH merges a partial body (200), DELETE returns 204. Failures are RFC 9457 problem documents; `type` is a stable `urn:agoralume:error:…`.
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
  version: 0.1.0
servers:
- url: /
  description: 'Same-origin: the bundled build, where the SPA and the API share a host'
- url: /api
  description: Behind an edge/dev proxy (VITE_API_PREFIX=/api)
- url: http://127.0.0.1:8080
  description: A local backend (pnpm dev:api)
paths:
  /v1beta/accounts:
    get:
      tags:
      - accounts
      summary: Every existing account, for the admin dashboard's account list.
      operationId: list_accounts
      responses:
        '200':
          description: Every account's id and login name; never a password
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountSummary'
        '401':
          description: Not signed in
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Not permitted for this identity
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      tags:
      - accounts
      summary: |-
        Provisions a brand-new account with an admin-chosen username and
        password. There's no self-service registration — this is the only way an
        account gets created.
      operationId: create_account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
        required: true
      responses:
        '201':
          description: The created account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSummary'
        '401':
          description: Not signed in
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Not permitted for this identity
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Empty/reserved/taken username, empty password, or no persistent backend
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1beta/accounts/{accountId}:
    patch:
      tags:
      - accounts
      summary: |-
        Changes an existing account's username, password, or both. Every live
        session for that account is revoked: its tokens stop working immediately and
        the holder must sign in again.
      operationId: update_account
      parameters:
      - name: accountId
        in: path
        description: The account to edit
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccountRequest'
        required: true
      responses:
        '200':
          description: The updated account; its sessions are revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSummary'
        '401':
          description: Not signed in
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Not permitted for this identity
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Unknown id, empty/reserved/taken username, empty password, or no persistent backend
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1beta/auth/login:
    post:
      tags:
      - auth
      summary: |-
        Logs in as the admin (username `"admin"`) or a regular account (its own
        stored username). An account with no fixed password yet accepts this
        boot's generated one instead — see the server log at startup.
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: A fresh token pair and the session's role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          description: Unknown username or wrong password (not distinguished)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - {}
  /v1beta/auth/logout:
    post:
      tags:
      - auth
      summary: |-
        Ends the current session: the presented access token (from the
        `Authorization` header) and refresh token stop working immediately.
      operationId: logout
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
        required: true
      responses:
        '204':
          description: Signed out (idempotent)
      security:
      - {}
  /v1beta/auth/refresh:
    post:
      tags:
      - auth
      summary: |-
        Mints a fresh access token from a still-valid refresh token, without
        asking for the password again. The refresh token itself is not rotated —
        it keeps working until its own (much longer) expiry.
      operationId: refresh
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '200':
          description: A fresh access token; the refresh token is unchanged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
        '401':
          description: Unknown, expired, revoked, or not a refresh token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - {}
  /v1beta/departments:
    get:
      tags:
      - departments
      summary: Every department in the workspace, across all organizations.
      operationId: list_depts
      responses:
        '200':
          description: Every department, across all organizations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Department'
        '401':
          description: Not signed in
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Not permitted for this identity
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      tags:
      - departments
      summary: Creates a department.
      operationId: create_dept
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Department'
        required: true
      responses:
        '201':
          description: The created department
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
        '401':
          description: Not signed in
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Not permitted for this identity
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1beta/departments/{departmentId}:
    get:
      tags:
      - departments
      summary: One department by id.
      operationId: get_dept
      parameters:
      - name: departmentId
        in: path
        description: The department to read
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The department
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
        '401':
          description: Not signed in
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Not permitted for this identity
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Unknown department
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
    delete:
      tags:
      - departments
      summary: Deletes a department.
      operationId: delete_dept
      parameters:
      - name: departmentId
        in: path
        description: The department to delete
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Deleted
        '401':
          description: Not signed in
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Not permitted for this identity
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Unknown department
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
    patch:
      tags:
      - departments
      summary: Merges a partial update onto a department.
      operationId: update_dept
      parameters:
      - name: departmentId
        in: path
        description: The department to update
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentPatch'
        required: true
      responses:
        '200':
          description: The updated department
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
        '401':
          description: Not signed in
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Not permitted for this identity
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Unknown department
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Malformed patch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1beta/groups:
    get:
      tags:
      - groups
      summary: Every chat group in the workspace.
      operationId: list_groups
      responses:
        '200':
          description: Every group
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Group'
        '401':
          description: Not signed in
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Not permitted for this identity
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      tags:
      - groups
      summary: Creates a group.
      operationId: create_group
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Group'
        required: true
      responses:
        '201':
          description: The created group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '401':
          description: Not signed in
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Not permitted for this identity
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1beta/groups/{groupId}:
    get:
      tags:
      - groups
      summary: One group by id.
      operationId: get_group
      parameters:
      - name: groupId
        in: path
        description: The group to read
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '401':
          description: Not signed in
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Not permitted for this identity
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Unknown group
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
    delete:
      tags:
      - groups
      summary: Deletes a group.
      operationId: delete_group
      parameters:
      - name: groupId
        in: path
        description: The group to delete
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Deleted
        '401':
          description: Not signed in
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Not permitted for this identity
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Unknown group
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
    patch:
      tags:
      - groups
      summary: Merges a partial update onto a group.
      operationId: update_group
      parameters:
      - name: groupId
        in: path
        description: The group to update
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupPatch'
        required: true
      responses:
        '200':
          description: The updated group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '401':
          description: Not signed in
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Not permitted for this identity
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Unknown group
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Malformed patch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1beta/groups/{groupId}/events:
    post:
      tags:
      - chat
      summary: |-
        Posts an environment event — rain, time passing, an emergency — letting the
        world outside the chat influence the agents. Its effect arrives on the SSE
        stream.
      operationId: post_event
      parameters:
      - name: groupId
        in: path
        description: The group to post the event into
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventBody'
        required: true
      responses:
        '202':
          description: Queued
        '401':
          description: Not signed in
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Not permitted for this identity
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Unknown group
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Blank or over-long description
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1beta/groups/{groupId}/messages:
    get:
      tags:
      - chat
      summary: |-
        A contiguous window of message history, oldest first. Max 500 lines (160
        without an `anchor`).
      operationId: list_messages
      parameters:
      - name: groupId
        in: path
        description: The group whose history to read
        required: true
        schema:
          type: string
      - name: anchor
        in: query
        description: Line id to centre the window on. Omitted, the window ends at the newest line.
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: before
        in: query
        description: Lines before the anchor (or before the tail). Clamped to 500.
        required: false
        schema:
          type:
          - integer
          - 'null'
          maximum: 500
          minimum: 0
      - name: after
        in: query
        description: Lines after the anchor. Ignored without an `anchor`. Clamped to 500.
        required: false
        schema:
          type:
          - integer
          - 'null'
          maximum: 500
          minimum: 0
      - name: since
        in: query
        description: |-
          Read mark (epoch ms). Without an `anchor`, widens the window back to cover
          every unread line.
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int64
      responses:
        '200':
          description: The window, oldest first; empty for an unknown group
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Message'
        '401':
          description: Not signed in
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Not permitted for this identity
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      tags:
      - chat
      summary: |-
        Posts a user message and starts the agents' turn. Replies, moods, and read
        receipts arrive on the SSE stream.
      operationId: send_message
      parameters:
      - name: groupId
        in: path
        description: The group to post into
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendBody'
        required: true
      responses:
        '200':
          description: The stored message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          description: Not signed in
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Not permitted for this identity
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Unknown group
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Blank or over-long text, or a `personaId` that is not a user identity
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1beta/groups/{groupId}/retry:
    post:
      tags:
      - chat
      summary: |-
        Resumes a turn suspended by a failed agent inference. A no-op if nothing is
        suspended. Its effect arrives on the SSE stream.
      operationId: retry_turn
      parameters:
      - name: groupId
        in: path
        description: The group whose suspended turn to resume
        required: true
        schema:
          type: string
      responses:
        '202':
          description: Accepted
        '401':
          description: Not signed in
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Not permitted for this identity
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Unknown group
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1beta/groups/{groupId}/stream:
    get:
      tags:
      - chat
      summary: Server-Sent Events for a group.
      description: |-
        Frames: unnamed = `Message`; `read` = `ReadReceipt`; `activity` =
        `{ "active": bool }`; `turn` = `Turn`; `debug` = `AgentTrace`;
        `suggestions` = `GroupSuggestions`. `activity` and `turn` are seeded on connect.
      operationId: stream
      parameters:
      - name: groupId
        in: path
        description: The group to stream
        required: true
        schema:
          type: string
      responses:
        '200':
          description: An open event stream
          content:
            text/event-stream: {}
        '401':
          description: Not signed in
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Not permitted for this identity
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1beta/groups/{groupId}/suggestions:
    get:
      tags:
      - chat
      summary: |-
        Cached conversation-starter suggestions, served from the server-side cache.
        Empty (`generatedAt == 0`) until the first generation completes.
      operationId: get_suggestions
      parameters:
      - name: groupId
        in: path
        description: The group whose suggestions to read
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The cached suggestions; a refresh may follow on the stream
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupSuggestions'
        '401':
          description: Not signed in
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Not permitted for this identity
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Unknown group
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      tags:
      - chat
      summary: |-
        Creates a fresh set of suggestions (the composer's "give me other ideas").
        Generated in the background; the result arrives on the `suggestions` SSE
        frame. Rate-limited server-side — repeated calls coalesce.
      operationId: regenerate_suggestions
      parameters:
      - name: groupId
        in: path
        description: The group to regenerate suggestions for
        required: true
        schema:
          type: string
      responses:
        '202':
          description: Accepted, or coalesced with a recent one
        '401':
          description: Not signed in
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Not permitted for this identity
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Unknown group
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1beta/groups/{groupId}/traces:
    get:
      tags:
      - diagnostics
      summary: |-
        Recent agent traces: the prompt each character received and what it decided.
        Live updates arrive as `debug` SSE frames.
      operationId: list_traces
      parameters:
      - name: groupId
        in: path
        description: The group whose traces to read
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Traces, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AgentTrace'
        '401':
          description: Not signed in
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Not permitted for this identity
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Unknown group
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1beta/health:
    get:
      tags:
      - service
      summary: Liveness probe, for an orchestrator rather than the app.
      operationId: health
      responses:
        '200':
          description: Up; the body is the literal `ok`
          content:
            text/plain:
              schema:
                type: string
      security:
      - {}
  /v1beta/llm/models:
    post:
      tags:
      - llm
      summary: |-
        Lists the models a provider endpoint offers, so the model field can be a
        picker. Admin-only. `apiKey` is required unless `baseUrl` matches the
        already-configured endpoint.
      operationId: list_llm_models
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LlmModelsQuery'
        required: true
      responses:
        '200':
          description: The models that endpoint reports
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LlmModelsView'
        '401':
          description: Not signed in
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Not permitted for this identity
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Empty or non-HTTP(S) baseUrl, no usable key, or the endpoint refused
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1beta/llm/settings:
    get:
      tags:
      - llm
      summary: |-
        The live LLM provider configuration. Any signed-in caller may read it;
        `canEdit` says whether this caller may write it.
      operationId: get_llm_settings
      responses:
        '200':
          description: The live configuration; the API key is reduced to `hasApiKey`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LlmSettingsView'
        '401':
          description: Not signed in
          content:
            application/problem+json:
              schema:
