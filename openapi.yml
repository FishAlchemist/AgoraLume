components:
  schemas:
    AccessToken:
      type: object
      required:
      - accessToken
      properties:
        accessToken:
          type: string
    AccountSummary:
      type: object
      description: |-
        One account, as admin sees it: its opaque id and its login name. Never
        carries a password or its hash. `account_id` is what [`UpdateAccountRequest`]
        targets via `PATCH /accounts/{account_id}`.
      required:
      - accountId
      - username
      properties:
        accountId:
          type: string
        username:
          type: string
    AgentTrace:
      type: object
      description: |-
        A debug record of one agent inference: exactly the system + context the
        character's model received, what it decided, and the tokens it cost. Streamed
        live as a `debug` SSE frame and available in bulk for panel hydration.
      required:
      - ts
      - groupId
      - personaId
      - personaName
      - system
      - conversation
      - action
      properties:
        action:
          type: string
          description: 'The chosen action: `speak` | `speakWithMood` | `mood` | `read`.'
        conversation:
          type: string
          description: The conversation/context text the agent read (the "public" messages).
        durationMs:
          type:
          - integer
          - 'null'
          format: int64
          description: Wall-clock time the brain call took, in milliseconds.
        estimatedCost:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/Cost'
            description: |-
              This one call's own estimated cost, priced at the rate configured when
              it was recorded. Filled in by [`crate::state::AppState::record_trace`]
              (the caller never sets it), so it starts `None` at construction and is
              absent whenever pricing isn't configured. Always an estimate — see
              [`Cost`].
        groupId:
          type: string
        message:
          type:
          - string
          - 'null'
          description: The spoken line, when it spoke.
        model:
          type:
          - string
          - 'null'
          description: |-
            The model that produced this inference (e.g. `gpt-4o-mini`); absent for
            the mock brain, which runs no model.
        mood:
          type:
          - string
          - 'null'
          description: The mood, when it showed one.
        personaId:
          type: string
        personaName:
          type: string
        system:
          type: string
          description: The full system prompt the agent got (persona + variables + roster).
        ts:
          type: integer
          format: int64
        usage:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/TokenUsage'
            description: Tokens this inference cost; absent for the mock brain.
    ApiError:
      type: object
      description: |-
        An RFC 9457 problem document — the body of every 4xx this API produces.

        Constructed through the named helpers below rather than field-by-field, so
        the slug used for a given status is decided in exactly one place and can't
        drift between handlers.
      required:
      - type
      - title
      - status
      properties:
        detail:
          type:
          - string
          - 'null'
          description: |-
            The human-readable explanation of *this specific* occurrence — the
            sentence that used to be the entire `text/plain` body. Safe to show a
            user; never carries a secret, a stack trace, or a provider's raw
            response.
        status:
          type: integer
          format: int32
          description: |-
            The HTTP status code, repeated in the body so a problem document stays
            meaningful when it's logged or forwarded away from its response.
          minimum: 0
        title:
          type: string
          description: |-
            The status code's canonical reason phrase (e.g. `Forbidden`) — a short
            human summary of the problem *type*, not of this occurrence.
        type:
          type: string
          description: |-
            Stable, machine-readable identifier for *what* went wrong, e.g.
            `urn:agoralume:error:not-admin`. Match on this rather than on `detail`,
            whose wording is free to change. Always present.
          example: urn:agoralume:error:not-found
    Cost:
      type: object
      description: |-
        An estimated cost breakdown for the accumulated usage. Always an estimate:
        rates are operator-supplied and providers/models differ, so the UI labels it
        "for reference only".
      required:
      - currency
      - input
      - cachedInput
      - output
      - total
      properties:
        cachedInput:
          type: number
          format: double
          description: Cost of cached input tokens.
        currency:
          type: string
          description: Currency label the rates are in (e.g. `USD`).
        input:
          type: number
          format: double
          description: Cost of fresh (non-cached) input tokens.
        output:
          type: number
          format: double
          description: Cost of output tokens.
        total:
          type: number
          format: double
          description: Sum of the above.
    CreateAccountRequest:
      type: object
      description: |-
        The `POST /accounts` request: the initial login for a brand-new account,
        chosen by admin and communicated to whoever the account is for out of
        band — there's no self-service registration or password-reset flow.
      required:
      - username
      - password
      properties:
        password:
          type: string
        username:
          type: string
    DebugUsage:
      type: object
      description: |-
        Cumulative LLM usage across the whole server (since first run, when
        persisted; since startup otherwise) — the global "total usage" view.
        `GET /usage`.
      required:
      - requests
      - promptTokens
      - completionTokens
      - totalTokens
      - cachedPromptTokens
      - cacheHitRatio
      properties:
        cacheHitRatio:
          type: number
          format: double
          description: |-
            Cached prompt tokens ÷ prompt tokens, in `0.0..=1.0`; `0` before any
            usage is seen. How much the cache is saving.
        cachedPromptTokens:
          type: integer
          format: int64
          minimum: 0
        completionTokens:
          type: integer
          format: int64
          minimum: 0
        estimatedCost:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/Cost'
            description: |-
              The running total, accrued one trace at a time at whatever rate was
              configured when each trace was recorded. Present once at least one
              costed trace has been recorded; absent when pricing has never been
              configured. Always an estimate — see [`Cost`].
        models:
          type: array
          items:
            $ref: '#/components/schemas/ModelUsage'
          description: |-
            The same totals broken down by model, largest (by total tokens) first.
            Empty until the first inference is recorded.
        promptTokens:
          type: integer
          format: int64
          minimum: 0
        requests:
          type: integer
          format: int64
          description: Number of agent inferences (LLM requests in LLM mode).
          minimum: 0
        totalTokens:
          type: integer
          format: int64
          minimum: 0
    Department:
      type: object
      description: |-
        A sub-unit inside an organization; its variables sit between the org's and
        the persona's in the inheritance chain.
      required:
      - organizationId
      - name
      properties:
        blurb:
          type:
          - string
          - 'null'
        color:
          type:
          - string
          - 'null'
        id:
          type: string
        name:
          type: string
        organizationId:
          type: string
        variables:
          type:
          - object
          - 'null'
          additionalProperties:
            type: string
          propertyNames:
            type: string
    DepartmentPatch:
      type: object
      description: 'A partial Department: only the properties present are merged. `id` is ignored.'
      properties:
        blurb:
          type:
          - string
          - 'null'
        color:
          type:
          - string
          - 'null'
        id:
          type: string
        name:
          type: string
        organizationId:
          type: string
        variables:
          type:
          - object
          - 'null'
          additionalProperties:
            type: string
          propertyNames:
            type: string
    EventBody:
      type: object
      description: The body of an environment-event request.
      required:
      - description
      properties:
        description:
          type: string
          description: What changed, e.g. "It starts to rain."
          maxLength: 1000
        urgent:
          type: boolean
          description: |-
            Urgent events preempt the current turn; ordinary ones fold into the
            context at the next agent boundary.
    Group:
      type: object
      description: |-
        A chat room: the AI personas that may speak, plus the user identity that
        represents "you" here.
      required:
      - name
      - personaIds
      - selfPersonaId
      properties:
        id:
          type: string
        name:
          type: string
        personaIds:
          type: array
          items:
            type: string
        selfPersonaId:
          type: string
    GroupPatch:
      type: object
      description: 'A partial Group: only the properties present are merged. `id` is ignored.'
      properties:
        id:
          type: string
        name:
          type: string
        personaIds:
          type: array
          items:
            type: string
        selfPersonaId:
          type: string
    GroupSuggestions:
      type: object
      description: |-
        Conversation-starter suggestions for a group: a few short first-person
        messages the user could send next when they aren't sure what to say. Generated
        server-side and cached (and persisted) so they aren't recomputed on every
        open — the frontend only fetches and displays them. Time-aware via
        [`GroupSuggestions::time_of_day`] so an evening opener isn't offered in the
        morning. `GET /groups/{id}/suggestions`.
      required:
      - prompts
      - generatedAt
      properties:
        generatedAt:
          type: integer
          format: int64
          description: When these were generated (epoch ms); `0` before the first generation.
        prompts:
          type: array
          items:
            type: string
          description: |-
            The suggested opener lines, in the user's language. Empty until the first
            generation for this group completes.
        throughId:
          type:
          - string
          - 'null'
          description: |-
            Id of the last conversation message present when these were generated — the
            conversation-staleness key. Server bookkeeping the UI can ignore; absent
            when the group had no messages yet.
        timeOfDay:
          type: string
          description: |-
            The coarse time-of-day bucket the suggestions were tuned for
            (`morning` / `afternoon` / `evening` / `night`) — lets the server tell when
            they've gone stale against the clock, and the UI hint the framing.
    LlmModelInfo:
      type: object
      description: |-
        One model a provider's listing endpoint reported. `name` is a display label
        when the provider offers one (Gemini does; OpenAI-compatible listings
        usually don't), never required for choosing the model — `id` is what's
        actually sent as `LlmSettings::model`.
      required:
      - id
      properties:
        id:
          type: string
        name:
          type:
          - string
          - 'null'
    LlmModelsQuery:
      type: object
      description: |-
        The `POST /llm/models` request: which endpoint to list models from. `apiKey`
        is optional — omitted, the backend uses the currently-stored key, but only
        when `baseUrl` matches the stored endpoint (see `routes::llm`), so this
        can't be used to make the server send its stored credential to an arbitrary
        third-party URL.
      required:
      - baseUrl
      properties:
        apiKey:
          type:
          - string
          - 'null'
        baseUrl:
          type: string
    LlmModelsView:
      type: object
      description: The `POST /llm/models` response.
      required:
      - models
      properties:
        models:
          type: array
          items:
            $ref: '#/components/schemas/LlmModelInfo'
    LlmSettingsPatch:
      type: object
      description: |-
        A partial update to the LLM provider configuration — every field is
        optional; an absent field leaves the current value alone. `baseUrl` /
        `model` / `apiKey` treat an empty string as "clear this field", matching the
        endpoint's other optional-string convention (there's never a reason to
        *store* an empty string here). `pricing` with both rates at zero clears the
        configured pricing (shows token counts only) rather than pinning a $0 rate.
      properties:
        apiKey:
          type:
          - string
          - 'null'
          description: |-
            The new key, or `""` to clear it. Omit entirely to leave the stored key
            untouched — the frontend must never send this unless the operator
            actually typed a new value, or every unrelated settings save would wipe
            the key.
        baseUrl:
          type:
          - string
          - 'null'
        compressAfter:
          type:
          - integer
          - 'null'
          minimum: 0
        compressKeep:
          type:
          - integer
          - 'null'
          minimum: 0
        compressMaxTokens:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
        enabled:
          type:
          - boolean
          - 'null'
        maxRetries:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
        maxRpm:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
        maxTokens:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
        model:
          type:
          - string
          - 'null'
        pricing:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/Pricing'
        retryBaseMs:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
    LlmSettingsView:
      type: object
      description: |-
        The `GET`/`PATCH /llm/settings` response: the live LLM provider
        configuration, with the API key stripped to a presence flag. Built by hand
        from [`crate::llm_config::LlmSettings`] (never derived by serializing it
        directly) — that's the one place a leaked key would slip out.
      required:
      - enabled
      - hasApiKey
      - maxTokens
      - maxRpm
      - maxRetries
      - retryBaseMs
      - compressAfter
      - compressKeep
      - compressMaxTokens
      - canEdit
      properties:
        baseUrl:
          type:
          - string
          - 'null'
        canEdit:
          type: boolean
          description: |-
            Whether *this caller* may write this config (`PATCH /llm/settings`,
            `POST /llm/models`) — admin-only today (see `CurrentAdmin` in
            `backend/src/state.rs`), computed by the `GET /llm/settings` handler
            from the caller's actual `Subject`, not by anything in this struct's
            `From` impl (which always seeds it `false`, having no caller to ask).
            The frontend keys its write controls off this field instead of
            re-deriving "am I admin" from its own copy of the session role, so it
            can't drift from whatever the server actually enforces.
        compressAfter:
          type: integer
          minimum: 0
        compressKeep:
          type: integer
          minimum: 0
        compressMaxTokens:
          type: integer
          format: int64
          minimum: 0
        enabled:
          type: boolean
        hasApiKey:
          type: boolean
          description: |-
            Whether a key is currently stored. The key itself is never sent to a
            client once saved.
        maxRetries:
          type: integer
          format: int32
          minimum: 0
        maxRpm:
          type: integer
          format: int64
          minimum: 0
        maxTokens:
          type: integer
          format: int64
          minimum: 0
        model:
          type:
          - string
          - 'null'
        pricing:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/Pricing'
        retryBaseMs:
          type: integer
          format: int64
          minimum: 0
    LoginRequest:
      type: object
      required:
      - username
      - password
      properties:
        password:
          type: string
        username:
          type: string
          description: The fixed admin login name, or a regular account's own username.
    LogoutRequest:
      type: object
      description: The body of a sign-out request.
      properties:
        refreshToken:
          type:
          - string
          - 'null'
          description: |-
            The session's refresh token, so it dies with the access token. Omitting
            it leaves a token good for another 30 days alive, which is almost never
            what a sign-out means.
    Memory:
      type: object
      description: |-
        One persona-scoped memory: a fact a character chose to remember. Tagged with
        the persona identity hash ([`Persona::prompt_hash`]) that was in force when it
        was written, so a later rewrite of the persona never recalls a previous
        version's memories out of character. Persisted in the workspace snapshot
        alongside the personas the memories belong to.
      required:
      - id
      - personaId
      - promptHash
      - content
      - createdAt
      properties:
        content:
          type: string
        createdAt:
          type: integer
          format: int64
          description: Milliseconds since the Unix epoch when the memory was written.
        id:
          type: string
        personaId:
          type: string
        promptHash:
          type: string
          description: |-
            The persona identity hash in force when this memory was written — the
            scope key that keeps recall in-character. Always a real hash: a persona
            with no prompt (no hash) can hold no memories.
    MemoryInput:
      type: object
      description: 'Request body for writing a memory: just the text to remember.'
      required:
      - content
      properties:
        content:
          type: string
    Message:
      oneOf:
      - type: object
        description: A normal, readable message.
        required:
        - id
        - groupId
        - personaId
        - ts
        - text
        - kind
        properties:
          groupId:
            type: string
          id:
            type: string
          kind:
            type: string
            enum:
            - conversation
          personaId:
            type: string
          readBy:
            type:
            - array
            - 'null'
            items:
              type: string
            description: AI persona ids that have successfully processed (read) this message.
          streaming:
            type:
            - boolean
            - 'null'
          text:
            type: string
          ts:
            type: integer
            format: int64
      - type: object
        description: A persona broadcasting its current mood/emotion.
        required:
        - id
        - groupId
        - personaId
        - ts
        - mood
        - kind
        properties:
          groupId:
            type: string
          id:
            type: string
          kind:
            type: string
            enum:
            - mood
          mood:
            type: string
          note:
            type:
            - string
            - 'null'
          personaId:
            type: string
          ts:
            type: integer
            format: int64
      - type: object
        description: |-
          A system notice that an agent's inference failed after exhausting retries.
          Surfaces the HTTP status and canonical reason only — never the provider's
          raw body, which can leak quota or key details. `personaId` is the agent
          that failed. The frontend renders it as an error line with a retry button.
        required:
        - id
        - groupId
        - personaId
        - ts
        - reason
        - kind
        properties:
          groupId:
            type: string
          id:
            type: string
          kind:
            type: string
            enum:
            - system
          personaId:
            type: string
          reason:
            type: string
            description: |-
              The status's canonical reason (e.g. "Too Many Requests"), or a short
              generic label for a transport failure with no status.
          status:
            type:
            - integer
            - 'null'
            format: int32
            description: The HTTP status code, when the failure carried one (e.g. 429).
            minimum: 0
          ts:
            type: integer
            format: int64
      description: One chat line. Tagged by `kind`, matching the TypeScript `Message` union.
    ModelUsage:
      type: object
      description: |-
        One model's slice of the cumulative usage — e.g. after switching providers
        or models mid-run, each keeps its own running total rather than blending
        into a single undifferentiated number. Part of [`DebugUsage::models`].
      required:
      - model
      - requests
      - promptTokens
      - completionTokens
      - totalTokens
      - cachedPromptTokens
      properties:
        cachedPromptTokens:
          type: integer
          format: int64
          minimum: 0
        completionTokens:
          type: integer
          format: int64
          minimum: 0
        estimatedCost:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/Cost'
            description: |-
              Present once at least one costed trace has been recorded for this
              model; absent when pricing was never configured while it was in use.
        model:
          type: string
          description: |-
            The model name (e.g. `gpt-4o-mini`), or `"unknown"` for traces from a
            brain that runs no real model (the rule-based mock).
        promptTokens:
          type: integer
          format: int64
          minimum: 0
        requests:
          type: integer
          format: int64
          minimum: 0
        totalTokens:
          type: integer
          format: int64
          minimum: 0
    Organization:
      type: object
      description: |-
        A bucket for classifying personas that also carries shared template
        variables its members inherit.
      required:
      - name
      properties:
        blurb:
          type:
          - string
          - 'null'
        color:
          type:
          - string
          - 'null'
        id:
          type: string
        name:
          type: string
        variables:
          type:
          - object
          - 'null'
          additionalProperties:
            type: string
          propertyNames:
            type: string
    OrganizationPatch:
      type: object
      description: 'A partial Organization: only the properties present are merged. `id` is ignored.'
      properties:
        blurb:
          type:
          - string
          - 'null'
        color:
          type:
          - string
          - 'null'
        id:
          type: string
        name:
          type: string
        variables:
          type:
          - object
          - 'null'
          additionalProperties:
            type: string
          propertyNames:
            type: string
    Persona:
      type: object
      description: |-
        A user identity or an AI agent. AI personas carry the system prompt and
        variables the model needs; user personas are just a "you" to speak as.
      required:
      - name
      - kind
      - color
      properties:
        avatarUrl:
          type:
          - string
          - 'null'
        blurb:
          type:
          - string
          - 'null'
        color:
          type: string
        departmentId:
          type:
          - string
          - 'null'
        emoji:
          type:
          - string
          - 'null'
        gradient:
          type:
          - string
          - 'null'
        id:
          type: string
        kind:
          $ref: '#/components/schemas/PersonaKind'
        name:
          type: string
        organizationId:
          type:
          - string
          - 'null'
        promptHash:
          type:
          - string
          - 'null'
          description: |-
            Content hash of the raw `system_prompt` template — the persona's identity
            "version". Server-computed and effectively read-only on the wire: it is
            recomputed on every create/update (and on load) and any value a client
            sends is ignored. `None` when there is no prompt (user identities). Full
            lowercase-hex SHA-256; the UI shows a truncated prefix. See [`prompt_hash`].
        systemPrompt:
          type:
          - string
          - 'null'
        variables:
          type:
          - object
          - 'null'
          additionalProperties:
            type: string
          propertyNames:
            type: string
    PersonaKind:
      type: string
      description: 'The two persona roles: a user''s own identity vs. an AI agent.'
      enum:
      - user
      - ai
    PersonaPatch:
      type: object
      description: 'A partial Persona: only the properties present are merged. `id` is ignored.'
      properties:
        avatarUrl:
          type:
          - string
          - 'null'
        blurb:
          type:
          - string
          - 'null'
        color:
          type: string
        departmentId:
          type:
          - string
          - 'null'
        emoji:
          type:
          - string
          - 'null'
        gradient:
          type:
          - string
          - 'null'
        id:
          type: string
        kind:
          $ref: '#/components/schemas/PersonaKind'
        name:
          type: string
        organizationId:
          type:
          - string
          - 'null'
        promptHash:
          type:
          - string
          - 'null'
          description: |-
            Content hash of the raw `system_prompt` template — the persona's identity
            "version". Server-computed and effectively read-only on the wire: it is
            recomputed on every create/update (and on load) and any value a client
            sends is ignored. `None` when there is no prompt (user identities). Full
            lowercase-hex SHA-256; the UI shows a truncated prefix. See [`prompt_hash`].
        systemPrompt:
          type:
          - string
          - 'null'
        variables:
          type:
          - object
          - 'null'
          additionalProperties:
            type: string
          propertyNames:
            type: string
    PersonaUsage:
      type: object
      description: |-
        One persona's own slice of a usage total — a further breakdown by which
        character is driving the spend. Serves both `GET
        /usage/by-persona?groupId=…` (one group's [`DebugUsage`]) and the
        site-wide `GET /usage/by-persona` (summed across every group).
      required:
      - personaId
      - usage
      properties:
        personaId:
          type: string
        usage:
          $ref: '#/components/schemas/DebugUsage'
    Pricing:
      type: object
      description: |-
        Token pricing used to turn usage into an estimated cost. Rates are per
        1,000,000 tokens, in `currency`. A rough operator-supplied estimate — models
        and providers differ — so the UI always labels the result "for reference".
        Doubles as a wire type (`GET`/`PATCH /llm/settings`), hence `camelCase`; the
        one place that reads a little unusual is its own corner of `llm.toml`.
      required:
      - inputPerM
      - cachedInputPerM
      - outputPerM
      - currency
      properties:
        cachedInputPerM:
          type: number
          format: double
          description: |-
            Price per 1M cached input tokens. Usually cheaper than fresh input;
            defaults to the fresh input rate when not set (a conservative estimate
            that shows no cache saving until a discounted rate is provided).
        currency:
          type: string
          description: Currency label the rates are quoted in.
        inputPerM:
          type: number
          format: double
          description: Price per 1M fresh (non-cached) input tokens.
        outputPerM:
          type: number
          format: double
          description: Price per 1M output tokens.
    PromptLabel:
      type: object
      description: |-
        A user-assigned, git-tag-style name for a persona identity hash
        ([`Persona::prompt_hash`]). Held in a side table so naming a version never
        mutates the persona itself; content-addressing means reverting to earlier
        exact prompt text resolves back to the same (possibly already-named) hash.
      required:
      - hash
      - label
      properties:
        hash:
          type: string
        label:
          type: string
    PromptLabelInput:
      type: object
      description: Request body for naming a prompt identity hash. A blank label clears the name.
      required:
      - label
      properties:
        label:
          type: string
    ReadReceipt:
      type: object
      description: |-
        A single AI persona acknowledging it successfully processed a message —
        whether or not it chose to reply (agents may read without replying).
      required:
      - groupId
      - messageId
      - personaId
      properties:
        groupId:
          type: string
        messageId:
          type: string
        personaId:
          type: string
    RefreshRequest:
      type: object
      required:
      - refreshToken
      properties:
        refreshToken:
          type: string
    SendBody:
      type: object
      description: The body of a send request.
      required:
      - text
      properties:
        personaId:
          type:
          - string
          - 'null'
          description: |-
            Which user identity to author as; must be a `user` persona, not an AI
            one. Omitted, the group's `selfPersonaId` is used.
        text:
          type: string
          description: The message text.
          maxLength: 8000
    ServerMeta:
      type: object
      description: |-
        What the running server offers — lets the client tell a mock build (no LLM,
        in-memory only) apart from a production one, independently of whether the
        server is reachable at all.
      required:
      - mock
      - llm
      - persistent
      - authRequired
      - version
      properties:
        authRequired:
          type: boolean
          description: |-
            Whether a client must log in (`POST /auth/login`) before anything
            else works — false under mock mode or `AGORALUME_AUTH_DISABLED`, in
            which case every request resolves to the bootstrap account with no
            token at all. Independent of `mock`/`llm`: a persistent server with
            no real model wired in still enforces login.
        llm:
          type: boolean
          description: An LLM is wired in to generate replies.
        mock:
          type: boolean
          description: |-
            No LLM and no persistence — the "mock" mode. Equivalent to
            `!llm && !persistent`.
        persistent:
          type: boolean
          description: State is persisted and survives a restart.
        version:
          type: string
          description: Server crate version.
    Settings:
      type: object
      description: User-level preferences.
      required:
      - uiLanguage
      - nativeLanguage
      - chatFontSize
      properties:
        chatFontSize:
          type: integer
          format: int32
        nativeLanguage:
          type: string
        uiLanguage:
          type: string
    SettingsPatch:
      type: object
      description: 'A partial Settings: only the properties present are merged. `id` is ignored.'
      properties:
        chatFontSize:
          type: integer
          format: int32
        nativeLanguage:
          type: string
        uiLanguage:
          type: string
    TokenPair:
      type: object
      required:
      - accessToken
      - refreshToken
      - role
      properties:
        accessToken:
          type: string
          description: 'Short-lived; sent as `Authorization: Bearer <token>` on every request.'
        refreshToken:
          type: string
          description: |-
            Long-lived; used only against `POST /auth/refresh` to mint a fresh
            access token without asking for the password again.
        role:
          type: string
          description: |-
            `"admin"` or `"account"` — which kind of session this token belongs
            to, so the frontend can route an admin session to its own dashboard
            instead of a workspace it doesn't have. A UX routing hint only, not
            itself a permission grant: every route still checks the token's
            actual `Subject` server-side regardless of what this field says.
    TokenUsage:
      type: object
      description: |-
        Token usage for one LLM inference. Zero across the board when the provider
        reports nothing; entirely absent (on the trace) for the rule-based mock,
        which makes no LLM call.
      required:
      - promptTokens
      - completionTokens
      - totalTokens
      - cachedPromptTokens
      properties:
        cachedPromptTokens:
          type: integer
          format: int64
          description: |-
            Of the prompt tokens, how many were served from the provider's cache —
            billed cheaper. The basis for the cache-hit ratio and cache savings.
          minimum: 0
        completionTokens:
          type: integer
          format: int64
          description: Output ("completion") tokens billed for this call.
          minimum: 0
        promptTokens:
          type: integer
          format: int64
          description: Input ("prompt") tokens billed for this call.
          minimum: 0
        totalTokens:
          type: integer
          format: int64
          description: |-
            Total tokens the provider reported (or input+output when it only gives
            the two).
          minimum: 0
    Turn:
      type: object
      description: |-
        A processing round: what triggered it and how far each AI member has got.
        Owned by the backend and streamed independently of message history (a named
        `turn` SSE frame, seeded on connect), so the pinned progress bar reflects the
        *current* processing state whether or not the trigger line is in the loaded
        window — and shows progress for event triggers that have no user message at
        all. `active` tracks whether the coordinator is still running the round.
      required:
      - id
      - groupId
      - trigger
      - startedAt
      - active
      - members
      properties:
        active:
          type: boolean
          description: Whether the coordinator is still running this turn.
        groupId:
          type: string
        id:
          type: string
        members:
          type: array
          items:
            $ref: '#/components/schemas/TurnMember'
          description: |-
            The AI members participating, in the group's member order, each with its
            progress this round.
        startedAt:
          type: integer
          format: int64
          description: Epoch millis when the turn started.
        trigger:
          $ref: '#/components/schemas/TurnTrigger'
    TurnMember:
      type: object
      description: One AI member's progress within a turn.
      required:
      - personaId
      - state
      properties:
        personaId:
          type: string
        replyId:
          type:
          - string
          - 'null'
          description: |-
            The id of this member's first reply line this turn — the avatar's jump
            target. Present only once `state` is `replied`.
        state:
          $ref: '#/components/schemas/TurnMemberState'
    TurnMemberState:
      type: string
      description: |-
        How far one AI member has got in the current turn — the buckets the pinned
        progress bar tints avatars by. Mirrors a read receipt's meaning but is
        turn-scoped rather than message-scoped, so it works for an event trigger that
        has no message to hang a receipt on.
      enum:
      - pending
      - read
      - replied
    TurnTrigger:
      oneOf:
      - type: object
        description: |-
          A user (or persona) message. `messageId` locates it in the log; `text` and
          `personaId` are carried so the bar can render the trigger even when that
          line is outside the client's loaded history window.
        required:
        - messageId
        - personaId
        - text
        - kind
        properties:
          kind:
            type: string
            enum:
            - message
          messageId:
            type: string
          personaId:
            type: string
          text:
            type: string
      - type: object
        description: |-
          An environment event — rain, time passing, an emergency. `label` is the
          description shown; there is no message to jump to.
        required:
        - label
        - kind
        properties:
          kind:
            type: string
            enum:
            - event
          label:
            type: string
      description: |-
        What kicked off a turn: a conversation line someone sent, or an environment
        event that carries no message of its own. Tagged by `kind` to match the
        TypeScript union.
    UpdateAccountRequest:
      type: object
      description: |-
        The `PATCH /accounts/{account_id}` request: admin changing an existing
        account's login — its username, its password, or both. Both fields are
        optional and independent (`None` leaves that field untouched); an empty
        patch is a harmless no-op. There's still no self-service path — this is
        admin editing *someone else's* login, not an account changing its own.
      properties:
        password:
          type:
          - string
          - 'null'
        username:
          type:
          - string
          - 'null'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Access token from `POST /auth/login`. Opaque; does not survive a server restart. Waived when `GET /meta` reports `authRequired: false`.'
security:
- bearerAuth: []
