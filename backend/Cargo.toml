[package]
name = "agoralume-backend"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Backend API server for AgoraLume, an open-source platform for user and multi-AI group chats with modular personas."

[dependencies]
argon2 = "0.5.3"
async-trait = "0.1"
axum = "0.8.9"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dotenvy = "0.15.7"
rand_core = { version = "0.6.4", features = ["getrandom"] }
rig-core = "0.40.0"
schemars = { version = "1", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
toml = "1.1.4"
tower-http = { version = "0.7.0", features = ["cors", "fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
utoipa = { version = "5.5.0", features = ["axum_extras", "yaml"] }
utoipa-axum = "0.2.0"
uuid = { version = "1.24.0", features = ["v4"] }
webbrowser = "1.2.1"

[dev-dependencies]
# `test-util` (not part of tokio's `full`) enables paused-clock tests, so the
# rate limiter's timing can be asserted without real waits.
tokio = { version = "1.53.1", features = ["test-util"] }
# `util` brings `ServiceExt::oneshot`, for driving the router directly in CORS
# preflight tests without binding a real socket.
tower = { version = "0.5", features = ["util"] }
