name: Bundle

# Packages the distributable zip for each OS (Linux + Windows) on every push to
# main and on PRs, and uploads each as an artifact that expires after one day.
# Kept separate from ci.yml because packaging is a different concern from the
# quality gates.
#
# Same policy as ci.yml: only first-party actions (GitHub's actions/*, pnpm's
# action-setup) with Rust via the pre-bundled rustup, each pinned to a full
# commit SHA with the version recorded in a trailing comment.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch/PR cancels the older, still-running build.
concurrency:
  group: bundle-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bundle:
    name: Bundle (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One OS failing shouldn't cancel the other's bundle.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: AgoraLume-linux-x64
          - os: windows-latest
            artifact: AgoraLume-win32-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            backend/target/
          key: ${{ runner.os }}-cargo-bundle-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-bundle-
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.17.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      # scripts/bundle.mjs is the single source of truth for packaging: it runs
      # the same-origin frontend build and a release backend build, then stages
      # the exe + web/ + .env.example (so users can see which variables to set)
      # under dist-bundle/AgoraLume/.
      - name: Build distributable bundle
        run: node scripts/bundle.mjs
      # Upload the staged folder rather than the script's own .zip: GitHub always
      # wraps an artifact in one zip, so this way the download unzips exactly once
      # to the runnable exe + web/ + .env.example + BUILD_INFO.txt.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: dist-bundle/AgoraLume
          retention-days: 1
          if-no-files-found: error
          # `.env.example` is a dotfile, and upload-artifact drops hidden files by
          # default — without this the bundle ships with no settings template.
          include-hidden-files: true
